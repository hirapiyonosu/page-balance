<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="同人誌やグッズの費用を整理して、1冊の原価と、いくらで何部頒布すれば元が取れるかを出すツールです。記録はこの端末の中だけに保存されます。">
<meta name="theme-color" content="#1f1d1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="同人誌収支ツール">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>同人誌収支ツール</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 執筆進捗管理表と同じ地と色。上に結果の帯、下へ 費用 → 頒布先 → ペイできるか → 実績 */
:root{
  --paper:#fbfaf7; --panel:#ffffff; --ink:#1f1d1b; --sub:#6b6560; --line:#e4e0da;
  --accent:#1f62c9; --accent-ink:#1a52a8; --accent-soft:#e7effc; --accent-fg:#ffffff;
  --field-bg:#ffffff; --field-line:#8a837c; --btn-line:#77716a; --btn-shadow:0 1px 0 rgba(0,0,0,.08);
  --good:#2f8a5b; --good-soft:#e5f4e4; --bad:#c2453c; --bad-soft:#fbebeb; --book:#e8892b; --zebra:#f6f4f0;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1918; --panel:#232120; --ink:#efebe6; --sub:#a39d96; --line:#36332f;
  --accent:#6ea2f5; --accent-ink:#9cc0ff; --accent-soft:#1d2a3e; --accent-fg:#0f1b2d;
  --field-bg:#161514; --field-line:#77716a; --btn-line:#8a837c; --btn-shadow:0 1px 0 rgba(0,0,0,.4);
  --good:#5cc08a; --good-soft:#1c3226; --bad:#e8766d; --bad-soft:#3a1f1d; --book:#f09a45; --zebra:#1f1e1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1918; --panel:#232120; --ink:#efebe6; --sub:#a39d96; --line:#36332f;
  --accent:#6ea2f5; --accent-ink:#9cc0ff; --accent-soft:#1d2a3e; --accent-fg:#0f1b2d;
  --field-bg:#161514; --field-line:#77716a; --btn-line:#8a837c; --btn-shadow:0 1px 0 rgba(0,0,0,.4);
  --good:#5cc08a; --good-soft:#1c3226; --bad:#e8766d; --bad-soft:#3a1f1d; --book:#f09a45; --zebra:#1f1e1c; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:22px}
h2{font-family:var(--f-display);font-size:18px;margin:0}
h3{font-size:14px;margin:0}
p{margin:0}
.lead{font-size:13px;color:var(--sub)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
input[type=date],input[type=text],input[type=number],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--field-bg);border:1px solid var(--field-line);border-radius:4px;padding:5px 8px;min-width:0;max-width:100%;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
input[type=number],input[type=date]{font-family:var(--f-num)}
input[type=number]{text-align:right}
input.req,select.req{border:2px solid var(--accent)}
input.bad{border-color:var(--bad);background:var(--bad-soft)}
.guide{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700}
.guide .sw{flex:none;width:2.4rem;height:1.6rem;border:2px solid var(--accent);border-radius:4px;background:var(--field-bg)}
::placeholder{color:var(--sub);opacity:.7}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{font:inherit;font-size:13px;font-weight:500;background:var(--panel);color:var(--ink);border:1.5px solid var(--btn-line);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap;box-shadow:var(--btn-shadow)}
.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
.ghost:active,.btn:active{transform:translateY(1px);box-shadow:none}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
..ghost.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
tr.setrow>td{padding:0 0 12px;border-bottom:1.5px solid var(--line)}
.inline-set{position:sticky;left:0;width:min(900px,calc(100vw - 72px));border:1.5px solid var(--accent);border-radius:8px;padding:12px 14px;display:grid;gap:10px;background:var(--paper);white-space:normal}
.inline-set .tbl-wrap{max-width:100%}
.ghost.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:1.5px solid var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer;box-shadow:var(--btn-shadow)}
.x{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad)}
@media (pointer:coarse){.ghost,.btn{min-height:36px}}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 帯 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--band);color:var(--band-fg);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.band-in{max-width:1040px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.band .who{display:grid;min-width:0;flex:1 1 14rem}
.band .eyebrow{font-size:11px;letter-spacing:.1em;opacity:.85}
.band h1{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .now{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.band .now div{display:grid;line-height:1.2}
.band .now span{font-size:11px;opacity:.85}
.band .now b{font-family:var(--f-num);font-size:20px;font-weight:500;white-space:nowrap}
.band .helpbtn{font:inherit;font-size:13px;font-weight:700;background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:999px;padding:4px 12px;cursor:pointer}
@media (max-width:520px){.band h1{font-size:17px}.band .now b{font-size:17px}.band .now{gap:12px}}

/* まとまり */
section.card,details.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
section.card{padding:16px;display:grid;gap:12px}
.sec-h{display:grid;gap:2px}
details.card>summary{cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"開く ▾";flex:none;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--sub)}
details.card[open]>summary::after{content:"閉じる ▴"}
.card-body{padding:0 16px 16px;display:grid;gap:16px}
.note{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:13px;display:grid;gap:4px}
.warn{color:var(--bad);font-size:13px;font-weight:700}
.okmsg{color:var(--good);font-weight:700}

/* 入力の並び */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px}
.field{display:grid;gap:3px;align-content:start}
.field>label,.field>.k{font-size:12px;font-weight:700}
.field .hint{font-size:12px;color:var(--sub)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.subopt{margin-left:9px;padding-left:16px;border-left:2px solid var(--line);display:grid;gap:6px}

/* 表：全部の列を縦にそろえる */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-size:12px;font-weight:700;color:var(--sub);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.t td{padding:4px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
table.t th.r,table.t td.r{text-align:right}
table.t td.out{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t td.dash{color:var(--sub);text-align:center}
table.t tfoot td{border-bottom:0;border-top:1.5px solid var(--line);font-weight:700}
table.t input[type=text]{width:100%;min-width:8rem}
table.t input[type=number]{width:6.5rem}
table.t input.pct{width:4.5rem}
table.t select{min-width:6rem}
td.w-x{width:2rem;text-align:center}
td.nw{white-space:nowrap}
@media (max-width:560px){table.t input[type=number]{width:5.2rem}}

/* 費用の分類 */
.cats{display:grid;gap:8px}
details.cat{border:1px solid var(--line);border-radius:8px}
details.cat>summary{cursor:pointer;padding:8px 12px;list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;font-weight:700;font-size:14px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary .sum{font-family:var(--f-num);font-weight:500}
details.cat>summary::after{content:"開く ▾";font-size:12px;font-weight:400;color:var(--sub)}
details.cat[open]>summary::after{content:"閉じる ▴"}
.offtag{display:inline-block;font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--field-line);border-radius:999px;padding:0 8px;margin-left:4px}
details.cat.off>summary .sum{color:var(--sub);text-decoration:line-through}
details.cat .inner{padding:0 12px 10px;display:grid;gap:8px}
.cat .desc{font-size:12px;color:var(--sub);font-weight:400}

/* 結果 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;align-content:start}
.tile .k{font-size:12px;color:var(--sub)}
.tile .v{font-family:var(--f-num);font-size:24px;line-height:1.25}
.tile .v small{font-family:var(--f-body);font-size:13px;margin-left:2px}
.tile .d{font-size:12px;color:var(--sub)}
.tile.main{border-color:var(--accent);background:var(--accent-soft)}
.tile.good{border-color:var(--good);background:var(--good-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
tr.here td{background:var(--accent-soft)}
.chart svg{width:100%;height:auto;display:block}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.stock{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.stock b{font-family:var(--f-num);font-weight:500}

/* 共有画像 */
.shareimg{max-width:100%;border:1px solid var(--line);border-radius:8px}
textarea.io{width:100%;min-height:7rem;font-family:var(--f-num);font-size:12px}

/* タブ：押せる形（枠＋影）、開いているタブは青 */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{font:inherit;text-align:left;display:grid;gap:1px;background:var(--panel);color:var(--ink);border:1.5px solid var(--btn-line);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:var(--btn-shadow)}
.tab b{font-family:var(--f-display);font-size:16px}
.tab span{font-size:12px;color:var(--sub)}
.tab:hover{border-color:var(--accent)}
.tab.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.tab:active{transform:translateY(1px)}
@media (max-width:520px){.tab{padding:6px 8px}.tab b{font-size:14px}.tab span{font-size:11px;line-height:1.35}}
.pane{display:grid;gap:22px}
.wrap>*,.pane>*,section.card>*,.card-body>*,.inner>*{min-width:0}
.pick{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end}
.pick .field{flex:1 1 16rem}
.pick select{width:100%;font-size:15px}
.tbtn{font:inherit;font-size:13px;background:transparent;border:0;color:var(--accent-ink);padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* 使い方 */
.help{font-size:14px;display:grid;gap:12px}
.help h3{font-size:15px;font-family:var(--f-display)}
.help ul,.help ol{margin:4px 0 0;padding-left:1.3em;display:grid;gap:3px}
</style>

<div class="band" id="band"></div>
<div class="wrap">
  <div class="note" id="sampleNote" hidden>
    <b>いま表示しているのはサンプルの数字です。</b>
    <span>費用や価格は説明用の仮の値です。触って試したあと、下のボタンで空の状態から始められます。</span>
    <div><button class="btn" data-act="fresh">サンプルを消して新しく始める</button></div>
  </div>

  <details class="card" id="mgmt">
    <summary>保存と読み込み</summary>
    <div class="card-body" id="mgmtBody"></div>
  </details>

  <p class="guide"><span class="sw" aria-hidden="true"></span><span>青い枠のマスだけ入れれば使えます。ほかは必要なときに入れてください。</span></p>
  <nav class="tabs" id="tabs" aria-label="画面の切り替え"></nav>

  <div class="pane" id="tab-item">
    <section class="card" id="secPick1"></section>
    <section class="card" id="secInfo"></section>
    <section class="card" id="secCost"></section>
    <section class="card" id="secTry"></section>
  </div>
  <div class="pane" id="tab-place" hidden>
    <section class="card" id="secPlaces"></section>
  </div>
  <div class="pane" id="tab-plan" hidden>
    <section class="card" id="secPick3"></section>
    <section class="card" id="secCh"></section>
    <section class="card" id="secAlloc"></section>
    <section class="card" id="secPay"></section>
    <section class="card" id="secByCh"></section>
    <section class="card" id="secActual"></section>
    <section class="card" id="secShare"></section>
  </div>

  <details class="card" id="helpBox">
    <summary>使い方</summary>
    <div class="card-body help" id="helpBody"></div>
  </details>
</div>

<script>
"use strict";
const KEY = "doujin-shushi-v1";
const TOOL = "同人誌収支ツール";
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const yen = v => Math.round(v).toLocaleString("ja-JP") + "円";
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

/* ── 頒布先の種類と手数料 ── */
const TYPES = {
  event: { label: "イベント", paper: { mode: "none" }, ebook: null, costs: ["サークル参加費", "交通費", "宿泊費", "宅配搬入・搬出"] },
  shop: { label: "書店委託", paper: { mode: "rate", rate: 70 }, ebook: { mode: "rate", rate: 70 }, costs: ["納品の送料"] },
  mail: { label: "自家通販", paper: { mode: "booth" }, ebook: { mode: "booth" }, costs: ["梱包資材", "発送費（自分で負担する分）"] },
  dl: { label: "電子のみ", paper: null, ebook: { mode: "rate", rate: 70 }, costs: [] },
};
const FEE_MODES = {
  none: "手数料なし",
  rate: "取り分の率（掛け率）",
  booth: "BOOTH（5.6%＋45円）",
  boothwh: "BOOTH倉庫（＋2.5%＋25円）",
  fixed: "率＋1件あたりの額",
};
function net(fee, price) {
  price = n(price);
  if (!fee || !price) return 0;
  switch (fee.mode) {
    case "none": return price;
    case "rate": return Math.round(price * n(fee.rate) / 100);
    case "booth": return Math.round(price - (price * 0.056 + 45));
    case "boothwh": return Math.round(price - (price * 0.056 + 45) - (price * 0.025 + 25));
    case "fixed": return Math.round(price * (100 - n(fee.rate)) / 100 - n(fee.fixed));
  }
  return price;
}

/* ── 費用の分類（頒布物ごと） ── */
const CATS = [
  { key: "print", label: "印刷", desc: "印刷費・オプション・搬入や送料", items: ["印刷費", "オプション（特殊紙・加工）", "搬入・送料"] },
  { key: "make", label: "制作", desc: "画材・ソフト・フォント・資料・外注", items: ["画材・ソフト", "フォント・素材", "資料", "デザイン・ロゴ外注"] },
  { key: "guest", label: "ゲスト", desc: "献本の送料やお礼。献本の部数は頒布物の情報で", items: ["献本の送料", "お礼の品"] },
  { key: "bonus", label: "ノベルティ・特典", desc: "ペーパー・ステッカーなど配るもの", items: ["ペーパー", "ステッカー・ポストカード"] },
  { key: "booth", label: "スペース設営", desc: "何度も使うものは「この頒布物に」に％を入れて割る", items: ["ポスター・お品書き", "敷布・什器", "OPP袋"] },
  { key: "ad", label: "宣伝", desc: "広告・サンプル配布物", items: ["広告・サンプル配布物"] },
  { key: "dist", label: "頒布にかかる費用（かんたん用）", desc: "参加費・交通費など。頒布先を選ぶと計画と収支では使いません", items: ["サークル参加費", "交通費", "宿泊費", "委託・通販の送料"] },
  { key: "other", label: "その他", desc: "自由に足してください", items: [] },
];
const COLORS = ["#e8892b", "#c8306a", "#2f6fd0", "#2f8a5b", "#8456c9", "#9a6000", "#1f1d1b"];

const newCosts = () => CATS.flatMap(c => c.items.map(name => ({ id: uid(), cat: c.key, name, amount: "", paid: false, share: "", memo: "" })));
const newProduct = (kind = "book", name = "") => ({
  id: uid(), name: name || (kind === "book" ? "新しい本" : "新しいグッズ"), kind, size: kind === "book" ? "B5" : "", pages: "",
  qty: "", keep: "", printer: "", tryPrice: "", tryFee: "", ebook: false, track: false, color: COLORS[0], costs: newCosts(), chans: [], sales: [],
});
const newChannel = (type = "event", name = "") => ({
  id: uid(), name: name || TYPES[type].label, type, date: "",
  paper: TYPES[type].paper ? { ...TYPES[type].paper } : null,
  ebook: TYPES[type].ebook ? { ...TYPES[type].ebook } : null,
  costs: TYPES[type].costs.map(nm => ({ id: uid(), name: nm, amount: "" })), alloc: {},
});

function sample() {
  const c109 = newChannel("event", "イベントA（サンプル）"); c109.date = "2026-12-30";
  c109.costs[0].amount = 10000; c109.costs[1].amount = 2000; c109.costs[3].amount = 3000;
  const lf = newChannel("event", "地方イベント（サンプル）"); lf.costs[0].amount = 6000; lf.costs[1].amount = 14000;
  const booth = newChannel("mail", "BOOTH"); booth.costs[0].amount = 1600;
  const melon = newChannel("shop", "メロンブックス"); melon.costs[0].amount = 1500;
  const book = newProduct("book", "本のタイトル（サンプル）");
  Object.assign(book, { pages: 44, qty: 200, keep: 10, printer: "〇〇印刷 早割セット（サンプル）", ebook: true, tryPrice: 500 });
  const pc = book.costs.find(c => c.name === "印刷費"); pc.amount = 62000;
  book.costs.find(c => c.name === "ポスター・お品書き").amount = 4000;

/* ── 計算 ── */
function chanNets(row) {
  const ch = CH(row.ch); if (!ch) return { pn: 0, en: 0 };
  return { pn: ch.paper ? net(ch.paper, row.pp) : 0, en: ch.ebook ? net(ch.ebook, row.ep) : 0 };
}
// 頒布先の費用を、そこで頒布する頒布物に割り振る
function allocOf(ch) {
  const users = S.products.filter(p => p.chans.some(r => r.ch === ch.id));
  const w = {}, manual = {};
  users.forEach(p => {
    const r = p.chans.find(r => r.ch === ch.id), x = chanNets(r);
    w[p.id] = x.pn * n(r.pn) + (p.ebook ? x.en * n(r.en) : 0);
    const m = ch.alloc[p.id]; if (m !== "" && m != null && Number.isFinite(Number(m))) manual[p.id] = Number(m);
  });
  const mSum = Object.values(manual).reduce((a, b) => a + b, 0);
  const autos = users.filter(p => !(p.id in manual));
  const wSum = autos.reduce((a, p) => a + w[p.id], 0);
  const rest = Math.max(0, 100 - mSum), out = {};
  users.forEach(p => {
    out[p.id] = p.id in manual ? manual[p.id] : autos.length ? (wSum > 0 ? rest * w[p.id] / wSum : rest / autos.length) : 0;
  });
  return { pct: out, total: ch.costs.reduce((a, c) => a + n(c.amount), 0), over: mSum > 100 };
}
function calc(p) {
  const part = c => n(c.amount) * (c.share === "" || c.share == null ? 100 : n(c.share)) / 100;
  // かんたん用の頒布費用は、頒布先を選んだら計画と収支では数えない（頒布先タブの費用と二重にしない）
  const ownQuick = p.costs.reduce((a, c) => a + part(c), 0);
  const distSum = p.costs.filter(c => c.cat === "dist").reduce((a, c) => a + part(c), 0);
  const distOff = p.chans.length > 0;
  const own = ownQuick - (distOff ? distSum : 0);
  const print = p.costs.filter(c => c.cat === "print").reduce((a, c) => a + n(c.amount) * (c.share === "" || c.share == null ? 100 : n(c.share)) / 100, 0);
  const chCost = {};
  let chTotal = 0;
  p.chans.forEach(r => { const ch = CH(r.ch); if (!ch) return; const a = allocOf(ch); chCost[ch.id] = a.total * (a.pct[p.id] || 0) / 100; chTotal += chCost[ch.id]; });
  const total = own + chTotal, qty = n(p.qty), sellable = Math.max(0, qty - n(p.keep));
  let planRev = 0, planN = 0, planPaper = 0;
  p.chans.forEach(r => { const x = chanNets(r); planRev += x.pn * n(r.pn); planN += n(r.pn); planPaper += n(r.pn); if (p.ebook) { planRev += x.en * n(r.en); planN += n(r.en); } });
  const avg = planN ? planRev / planN : 0;
  const be = avg > 0 ? Math.ceil(total / avg) : null;
  // 実績
  // 納品した先（書店委託・倉庫）で売れた分は委託先の在庫から、それ以外は手元から減らす
  let got = 0, sold = 0, sentOut = 0, soldHome = 0; const perCh = {}, perNet = {}, atShop = {};
  const dated = p.sales.filter(s => s.date), undated = p.sales.length - dated.length;
  const away = new Set(dated.filter(s => s.kind === "send").map(s => s.ch));
  S.channels.forEach(c => { if (c.type === "shop") away.add(c.id); });
  dated.forEach(s => {
    const ch = CH(s.ch); if (!ch) return;
    const q = n(s.qty);
    if (s.kind === "send") { sentOut += q; atShop[ch.id] = (atShop[ch.id] || 0) + q; return; }
    got += net(s.form === "ebook" ? ch.ebook : ch.paper, s.price) * q; sold += q;
    perCh[ch.id] = (perCh[ch.id] || 0) + q;
    perNet[ch.id] = (perNet[ch.id] || 0) + net(s.form === "ebook" ? ch.ebook : ch.paper, s.price) * q;
    if (s.form === "ebook") return;
    if (away.has(ch.id)) atShop[ch.id] = (atShop[ch.id] || 0) - q; else soldHome += q;
  });
  const inShops = Object.values(atShop).reduce((a, b) => a + Math.max(0, b), 0);
  const hand = sellable - sentOut - soldHome;
  return { own, ownQuick, distSum, distOff, unitQuick: qty ? ownQuick / qty : 0, print, chCost, chTotal, total, qty, sellable, planRev, planN, planPaper, avg, be, profit: planRev - total,
    unitPrint: qty ? print / qty : 0, unitOwn: qty ? own / qty : 0, unitAll: qty ? total / qty : 0, make: ownQuick - distSum, unitMake: qty ? (ownQuick - distSum) / qty : 0, got, sold, perCh, perNet, atShop, hand, inShops, remain: total - got, undated };
}

function chartSVG(r) {
  if (!r.avg || !r.total) return "";
  const maxX = Math.ceil(Math.max(r.planN, r.be || 0, 10) * 1.15), maxY = Math.max(r.total, r.avg * maxX) * 1.12;
  const W = 900, H = 270, L = 74, R = 20, T = 16, B = 40;
  const X = v => L + (W - L - R) * v / maxX, Y = v => H - B - (H - T - B) * v / maxY;
  const raw = maxY / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(k => k * mag).find(s => s >= raw);
  const ys = []; for (let v = 0; v <= maxY; v += step) ys.push(v);
  const be = r.be, lx = maxX * 0.62;
  const beX = be != null ? Math.min(Math.max(X(be), L + 70), W - R - 70) : 0;
  return `<div class="chart" role="img" aria-label="売れた部数と手取りの累計のグラフ"><svg viewBox="0 0 ${W} ${H}">
    ${ys.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--sub)">${(v / 10000).toLocaleString("ja-JP")}万円</text>`).join("")}
    <path d="M${X(0)},${Y(0)} L${X(maxX)},${Y(r.avg * maxX)} L${X(maxX)},${Y(0)} Z" fill="var(--accent)" opacity=".1"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(maxX)}" y2="${Y(r.avg * maxX)}" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${X(lx) + 6}" y="${Y(r.avg * lx) + 20}" font-size="13" fill="var(--accent-ink)">手取りの累計</text>
    <line x1="${L}" x2="${W - R}" y1="${Y(r.total)}" y2="${Y(r.total)}" stroke="var(--bad)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${L + 6}" y="${Y(r.total) - 7}" font-size="13" fill="var(--bad)">費用 ${yen(r.total)}</text>
    ${be != null ? `<line x1="${X(be)}" x2="${X(be)}" y1="${Y(r.total)}" y2="${H - B}" stroke="var(--ink)" stroke-dasharray="2 3"/><circle cx="${X(be)}" cy="${Y(r.total)}" r="5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/><text x="${beX}" y="${H - 8}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${be}部で元が取れる</text>` : ""}
    <text x="${L}" y="${H - B + 16}" font-size="12" fill="var(--sub)">0部</text><text x="${W - R}" y="${H - B + 16}" text-anchor="end" font-size="12" fill="var(--sub)">${maxX}部</text>
  </svg></div>`;
}

/* ── 入力 ── */
function setField(path, el) {
  const p = P();
  const v = el.type === "checkbox" ? el.checked : el.value;
  const [kind, a, b, c] = path.split(":");
  const numish = s => (s === "" ? "" : Number(s));
  if (kind.startsWith("p.")) { const k = kind.slice(2); p[k] = ["pages", "qty", "keep", "tryPrice", "tryFee"].includes(k) ? numish(v) : v; }
  else if (kind === "cost") { const x = p.costs.find(x => x.id === a); if (!x) return; x[b] = b === "paid" ? !!v : ["amount", "share"].includes(b) ? numish(v) : v; }
  else if (kind === "pch") { const row = p.chans.find(r => r.ch === a); if (row) row[b] = numish(v); }
  else if (kind === "ch") { const ch = CH(a); if (ch) ch[b] = v; }
  else if (kind === "chfee") { const ch = CH(a); if (ch && ch[b]) ch[b][c] = c === "mode" ? v : numish(v); }
  else if (kind === "chcost") { const ch = CH(a); const x = ch?.costs.find(x => x.id === b); if (x) x[c] = c === "amount" ? numish(v) : v; }
  else if (kind === "alloc") { const ch = CH(a); if (ch) { if (v === "") delete ch.alloc[b]; else ch.alloc[b] = Number(v); } }
  else if (kind === "sale") { const s = p.sales.find(s => s.id === a); if (!s) return; s[b] = ["qty", "price"].includes(b) ? numish(v) : v;
    if (b === "ch" || b === "form") { const row = p.chans.find(r => r.ch === s.ch); if (row) s.price = s.form === "ebook" ? row.ep : row.pp; } }
  save();
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.f || el.tagName === "SELECT" || el.type === "checkbox") return;
  setField(el.dataset.f, el);
  renderOuts();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.pick) { S.current = el.value; save(); renderAll(); return; }
  if (el.id === "sh-hide") { S.hideMoney = el.checked; save(); return; }
  if (el.id === "m-prog") { readProgress(el.files[0]); return; }
  if (el.dataset.f && (el.tagName === "SELECT" || el.type === "checkbox")) { setField(el.dataset.f, el); renderAll(); }
  else if (el.dataset.f && (el.dataset.f.startsWith("ch:") || el.dataset.f.startsWith("p.name"))) renderAll();
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.dataset?.cat) catOpen.set(d.dataset.cat, d.open);
  if (d.dataset?.roster) d.open ? openRoster.add(d.dataset.roster) : openRoster.delete(d.dataset.roster);

let armed = null;
function arm(btn, label, fn) {
  if (armed === btn.id) { armed = null; fn(); return; }
  armed = btn.id; btn.classList.add("armed"); btn.textContent = label;
  setTimeout(() => { if (armed === btn.id) { armed = null; renderAll(); } }, 3000);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = P(), act = b.dataset.act;
  if (act === "help") { $("helpBox").open = true; $("helpBox").scrollIntoView({ behavior: "smooth" }); return; }
  if (act === "tab") { S.tab = b.dataset.v; save(); renderTabs(); window.scrollTo({ top: 0 }); return; }
  if (act === "goPlace") { S.tab = "place"; openRoster.add(b.dataset.id); save(); renderAll(); $("place-" + b.dataset.id)?.scrollIntoView({ block: "center" }); return; }
  if (act === "addBook" || act === "addGoods") { const x = newProduct(act === "addBook" ? "book" : "goods"); x.color = COLORS[S.products.length % COLORS.length]; S.products.push(x); S.current = x.id; S.tab = "item"; }
  else if (act === "dup") { const x = JSON.parse(JSON.stringify(p)); x.id = uid(); x.name += "（複製）"; x.sales = []; x.costs.forEach(c => { c.id = uid(); }); S.products.push(x); S.current = x.id; }
  else if (act === "del") { if (S.products.length < 2) return arm(b, "もう一度押すと、頒布先も含めてすべて消してサンプルの状態に戻します", () => { S = sample(); save(); renderAll(); window.scrollTo({ top: 0 }); });
    return arm(b, "もう一度押すと消します", () => { S.products = S.products.filter(x => x.id !== p.id); S.channels.forEach(ch => delete ch.alloc[p.id]); S.current = S.products[0].id; save(); renderAll(); }); }
  else if (act === "fresh") { const x = newProduct("book"); S = { products: [x], channels: [], current: x.id, sample: false, tab: "item" }; }
  else if (act === "reset") return arm(b, "もう一度押すとサンプルに戻します", () => { S = sample(); save(); renderAll(); });
  else if (act === "color") p.color = b.dataset.v;
  else if (act === "addCost") { p.costs.push({ id: uid(), cat: b.dataset.cat, name: "", amount: "", paid: false, share: "", memo: "" }); catOpen.set(p.id + ":" + b.dataset.cat, true); }
  else if (act === "delCost") p.costs = p.costs.filter(x => x.id !== b.dataset.id);
  else if (act === "link") { const id = $("c-pick")?.value; if (!id) return; p.chans.push({ ch: id, pp: "", pn: "", ep: "", en: "" }); }
  else if (act === "newCh") { const ch = newChannel($("c-newtype").value, $("c-newname").value.trim()); S.channels.push(ch); openRoster.add(ch.id); }
  else if (act === "unlink") { p.chans = p.chans.filter(r => r.ch !== b.dataset.id); const ch = CH(b.dataset.id); if (ch) delete ch.alloc[p.id]; }
  else if (act === "addSale") { const row = p.chans[0]; p.sales.push({ id: uid(), date: today(), ch: row.ch, kind: "sell", form: "paper", qty: "", price: row.pp }); }
  else if (act === "delSale") p.sales = p.sales.filter(s => s.id !== b.dataset.id);
  else if (act === "addChCost") { CH(b.dataset.ch).costs.push({ id: uid(), name: "", amount: "" }); openRoster.add(b.dataset.ch); }
  else if (act === "delChCost") { const ch = CH(b.dataset.ch); ch.costs = ch.costs.filter(c => c.id !== b.dataset.id); }
  else if (act === "delCh") { const id = b.dataset.id; if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "もう一度押すと消します（計画と実績からも外れます）"; return; }
    S.channels = S.channels.filter(c => c.id !== id); S.products.forEach(x => { x.chans = x.chans.filter(r => r.ch !== id); x.sales = x.sales.filter(s => s.ch !== id); }); }
  else if (act === "export") { $("m-io").value = JSON.stringify({ format: "doujin-shushi", version: 1, data: S }); $("m-io").select(); try { navigator.clipboard.writeText($("m-io").value).then(() => { b.textContent = "コピーしました"; }, () => {}); } catch (_) {} return; }
  else if (act === "import") { try { const o = JSON.parse($("m-io").value); if (o.format !== "doujin-shushi" || !o.data?.products) throw 0; S = o.data; S.sample = false; save(); renderAll(); } catch (_) { b.textContent = "読み込めませんでした。書き出した内容をそのまま貼ってください"; } return; }
  else if (act === "share") { makeShare(); return; }
  else return;
  save(); renderAll();
});

function readProgress(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result); const bk = o.book; if (o.format !== "doujin-progress" || !bk) throw 0;
      const x = newProduct("book", bk.title || "読み込んだ本"); x.color = bk.color || COLORS[0];
      x.pages = (bk.rows || []).reduce((a, r) => a + n(r.pc), 0) || "";
      if (bk.event) { let ch = S.channels.find(c => c.name === bk.event); if (!ch) { ch = newChannel("event", bk.event); ch.date = bk.eventDate || ""; S.channels.push(ch); } x.chans.push({ ch: ch.id, pp: "", pn: "", ep: "", en: "" }); }
      S.products.push(x); S.current = x.id; S.sample = false; save(); renderAll();
    } catch (_) { alertLine("執筆進捗管理表の書き出しファイルではないようです"); }
  };
  fr.readAsText(file);
}
function alertLine(msg) { const el = $("m-io"); if (el) el.value = msg; }

  else head = r.be ? `${r.be}部で元が取れる計算` : "試算中";

  if (actual) { g.fillStyle = r.remain <= 0 ? "#2f8a5b" : p.color; roundRect(g, bx, by, Math.max(bh, bw * rate), bh, 15); g.fill();
    g.fillStyle = "#6b6560"; g.font = `500 24px ${body}`; g.fillText(`回収率 ${Math.round((r.total ? r.got / r.total : 0) * 100)}%`, bx, by + 70); }
  else if (r.be) { g.fillStyle = p.color; roundRect(g, bx, by, Math.max(bh, bw * Math.min(1, r.be / Math.max(r.planN, r.be))), bh, 15); g.fill();
    g.fillStyle = "#6b6560"; g.font = `500 24px ${body}`; g.fillText(`予定 ${r.planN}部のうち ${r.be}部で元が取れる`, bx, by + 70); }

  if (!hide) { g.font = `500 26px ${body}`; g.fillStyle = "#6b6560";
    g.fillText(`費用 ${yen(r.total)}`, 700, 430); g.fillText(actual ? `手取り ${yen(r.got)}` : `予定の手取り ${yen(r.planRev)}`, 700, 476);
    if (r.qty) g.fillText(`1冊の原価 ${yen(r.unitMake)}`, 700, 522); }
  // ツール名はいつも入れる
  g.fillStyle = p.color; g.fillRect(0, H - 8, W, 8);
  g.fillStyle = "#6b6560"; g.font = `700 24px ${disp}`; g.textAlign = "right"; g.fillText(`${TOOL}で計算`, W - 40, H - 32); g.textAlign = "left";
  $("shareOut").innerHTML = `<img class="shareimg" alt="${esc(p.name)}の収支の画像" src="${cv.toDataURL("image/png")}">`;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

load(); renderAll();
</script>
